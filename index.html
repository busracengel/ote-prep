<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTE Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OTE Prep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --paper:#F4F0E6; --paper-2:#ECE5D3;
    --red:#B23A2F; --brass:#9C7A3C; --green:#3E6B4F; --line:rgba(27,42,74,0.15);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;display:flex;flex-direction:column;}
  @media (min-width: 800px){
    .wrap{max-width:1100px;padding:28px 40px 60px;}
  }
  .brand{font-family:'Newsreader',serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;margin-bottom:14px;cursor:pointer;user-select:none;}
  .brand span{color:var(--red);font-style:italic;}

  /* top-level tabs */
  .maintabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .maintab{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);
    opacity:0.55;cursor:pointer;white-space:nowrap;text-align:center;
  }
  .maintab.active{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink);}

  /* question type trainer */
  .qt-summary{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:12px 0 16px;}
  .qt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 16px;}
  .qt-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;}
  .qt-card.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;}
  .qt-card h4{margin:0 0 5px;font-size:14px;}
  .qt-card p{margin:0;font-size:12px;opacity:.65;line-height:1.45;}
  .qt-chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px;}
  .qt-chip{font-size:11px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;}
  .qt-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .qt-type{font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;font-weight:700;}
  @media(max-width:560px){.qt-grid{grid-template-columns:1fr;}}

  /* level pills */
  .levelrow{display:flex;gap:8px;margin-bottom:16px;}
  .levelpill{
    flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
    padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
    opacity:0.5;cursor:pointer;
  }
  .levelpill.active{opacity:1;border-color:var(--brass);background:#fff;color:var(--brass);}

  .listaccess-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .listaccess-chip{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);opacity:.65;cursor:pointer;}
  .listaccess-chip.active{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink);}
  .listaccess-chip.back{margin-left:auto;opacity:.5;border-style:dashed;}

  .progress-row{display:flex;align-items:center;gap:10px;margin:2px 0 18px;}
  .progress-track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--brass);transition:width .3s ease;}
  .progress-count{font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.6;white-space:nowrap;}

  .stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:320px;margin-bottom:16px;}
  .stack-deco{position:absolute;width:88%;max-width:380px;aspect-ratio:5/6.2;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;}
  .stack-deco.d1{transform:rotate(-6deg) translateY(6px);z-index:1;opacity:.7;}
  .stack-deco.d2{transform:rotate(4deg) translateY(3px);z-index:2;opacity:.85;}
  .card{position:relative;z-index:3;width:88%;max-width:380px;aspect-ratio:5/6.2;cursor:pointer;perspective:1400px;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(27,42,74,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;overflow-y:auto;}
  .face.back{transform:rotateY(180deg);}
  .face-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--brass);text-transform:uppercase;margin-bottom:12px;}
  .word{font-family:'Newsreader',serif;font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.15;margin:0 0 8px;}
  .ipa{font-family:'JetBrains Mono',monospace;font-size:13px;opacity:.55;margin-bottom:16px;}
  .speak-btn{display:inline-flex;align-items:center;gap:6px;background:#5B9BD5;color:#fff;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:10px;}
  .speak-btn:active{transform:scale(.96);}
  .accent-row{display:flex;gap:6px;margin-top:10px;}
  .accent-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;opacity:.55;cursor:pointer;}
  .accent-chip.active{opacity:1;background:var(--brass);color:#fff;border-color:var(--brass);}
  .hint{margin-top:16px;font-size:12px;opacity:.4;}
  .meaning{font-family:'Newsreader',serif;font-size:22px;font-weight:500;margin:0 0 12px;}
  .example{font-size:13.5px;line-height:1.55;opacity:.75;font-style:italic;}
  .pos-tag{font-family:'JetBrains Mono',monospace;font-size:12px;font-style:italic;color:var(--brass);font-weight:600;}
  .synopp-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .syn-tag{font-family:'Inter',sans-serif;font-size:13px;color:var(--green);opacity:.9;}
  .opp-tag{font-family:'Inter',sans-serif;font-size:13px;color:var(--red);opacity:.9;}
  .family-row{font-family:'Inter',sans-serif;font-size:12px;opacity:.65;margin-top:4px;}
  .family-block{margin-top:14px;text-align:left;width:100%;}
  .family-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:4px;}
  .family-list{margin:0;padding-left:16px;font-size:11.5px;line-height:1.5;opacity:.75;}
  .family-list li{margin-bottom:3px;}
  .actions{display:flex;gap:12px;}
  .action-btn{flex:1;border:none;border-radius:12px;padding:15px 10px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .action-btn:active{transform:scale(.97);}
  .action-btn.review{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .action-btn.know{background:var(--green);color:#fff;}
  .action-btn.prev{background:#fff;color:var(--ink);border:1.5px solid var(--line);flex:0.8;}
  .action-btn.prev:disabled{opacity:.35;cursor:not-allowed;}
  .action-btn.prev:disabled:active{transform:none;}
  .deck-controls{display:flex;justify-content:center;margin-top:14px;}
  .link-btn{background:none;border:none;font-size:12px;color:var(--ink);opacity:.5;cursor:pointer;text-decoration:underline;}
  .end-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;}
  .end-title{font-family:'Newsreader',serif;font-size:28px;font-weight:600;}
  .end-stats{display:flex;gap:24px;margin:16px 0 24px;}
  .stat{text-align:center;}
  .stat-num{font-family:'Newsreader',serif;font-size:30px;font-weight:600;}
  .stat-num.green{color:var(--green);}
  .stat-num.red{color:var(--red);}
  .stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;opacity:.6;text-transform:uppercase;}
  .restart-btn{background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:13px 26px;font-weight:700;font-size:14px;cursor:pointer;}

  /* content sections (writing/speaking/reading/listening) */
  .section-title{font-family:'Newsreader',serif;font-size:21px;font-weight:600;margin:22px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .card-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .card-block h4{margin:0 0 6px;font-family:'Newsreader',serif;font-size:16.5px;font-weight:600;}
  .card-block p{margin:0 0 8px;font-size:13.5px;line-height:1.55;opacity:.85;}
  .card-block p:last-child{margin-bottom:0;}
  .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:6px;background:var(--paper-2);color:var(--brass);margin-bottom:8px;}
  .phrase-list{margin:0;padding-left:18px;font-size:13px;line-height:1.7;opacity:.85;}
  .booklink{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .booklink a{color:var(--ink);font-weight:700;font-size:13.5px;text-decoration:none;border-bottom:1.5px solid var(--brass);}
  .placeholder-note{font-size:12px;opacity:.55;font-style:italic;margin-top:6px;}

  /* strategy tips + timer tools */
  .tip-list{margin:0;padding-left:18px;font-size:13px;line-height:1.65;opacity:.85;}
  .tip-list li{margin-bottom:6px;}
  .timer-box{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .quiz-option{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-top:6px;font-size:13.5px;cursor:pointer;background:#fff;}
  .practice-q + .practice-q{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}
  .practice-q > p:first-child{margin-bottom:10px;}

  .quiz-option.selected{border-color:var(--brass);background:var(--paper-2);}
  .quiz-option.correct{border-color:var(--green);background:rgba(62,107,79,0.1);color:var(--green);font-weight:700;}
  .quiz-option.incorrect{border-color:var(--red);background:rgba(178,58,47,0.1);color:var(--red);font-weight:700;}
  .timer-display{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .timer-presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .timer-preset{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;opacity:.6;cursor:pointer;}
  .timer-preset.active{opacity:1;background:var(--brass);color:#fff;border-color:var(--brass);}
  .timer-controls{display:flex;gap:8px;margin-top:4px;}
  .timer-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:9px 18px;border-radius:999px;border:none;cursor:pointer;}
  .timer-btn.start{background:var(--green);color:#fff;}
  .timer-btn.reset{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .timer-btn.stop{background:var(--red);color:#fff;}
  .write-area{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;resize:vertical;background:#fff;color:var(--ink);}
  .write-area:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .wordcount-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:.6;}
  .wordcount-row.over{color:var(--red);opacity:1;}

  .def-word{border-bottom:1.5px dotted var(--brass);color:var(--brass);cursor:pointer;font-style:normal;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.4);z-index:999;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .toast.show{opacity:1;}
  .tr-meaning{font-family:'Inter',sans-serif;font-size:13px;opacity:.6;margin:8px 0;}

  .reader-pane{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
  .reader-topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--paper-2);font-weight:700;font-size:13px;}
  .reader-frame{width:100%;height:60vh;border:none;display:block;background:#fff;}

  .wordlist{display:flex;flex-direction:column;}
  .wl-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .wl-check{width:18px;height:18px;accent-color:var(--brass);flex-shrink:0;cursor:pointer;}
  .wl-word-wrap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer;}
  .wl-word{font-family:'Newsreader',serif;font-weight:600;font-size:15px;}
  .wl-ipa{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.45;}
  .wl-tr{font-family:'Inter',sans-serif;font-size:13px;color:var(--brass);font-weight:600;}
  .wl-item{flex:1;display:flex;flex-direction:column;gap:2px;}
  .wl-meaning{font-family:'Inter',sans-serif;font-size:12.5px;opacity:.65;line-height:1.4;}

.mistake-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
.mistake-stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.mistake-stat b{display:block;font-size:24px;color:var(--navy)}

.brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;padding-top:2px;margin-bottom:10px}.auth-area{position:relative}.authbar{display:flex;gap:7px;align-items:center}.account-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:var(--navy);font-weight:650;font-size:13px;line-height:1.1;cursor:pointer;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-popover{position:absolute;right:0;top:40px;width:270px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px #0002;z-index:50}.account-menu{display:grid;gap:5px;margin:4px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.account-menu-item{border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:9px;color:var(--navy);font:600 14px 'Newsreader',serif;cursor:pointer}.account-menu-item:hover{background:var(--soft)}.modal-backdrop{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100}.auth-modal{position:relative;width:min(92vw,420px);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0004}.modal-close{position:absolute;right:12px;top:9px;border:0;background:none;font-size:27px;color:var(--muted);cursor:pointer}.home-hero{margin:14px 0 16px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px 28px;box-shadow:0 8px 26px #0000000a}.home-hero h1{font-family:Georgia,serif;font-size:34px;line-height:1.12;margin:2px 0 8px;color:var(--navy)} .welcome-brand{font-family:'Newsreader',serif;font-weight:600;letter-spacing:-0.01em}.welcome-brand em{color:var(--red);font-style:italic;font-weight:600}.home-hero p{max-width:760px;font-size:16px;line-height:1.5;color:var(--muted);margin:9px 0}.home-actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 22px}.home-btn{border-radius:999px;padding:9px 17px;font-family:'Newsreader',serif;font-size:15px;line-height:1.1;font-weight:600;cursor:pointer}.home-btn.primary{background:var(--navy);color:#fff;border:1px solid var(--navy)}.home-btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:700}.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.home-card{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px}.home-card b{display:block;margin-bottom:6px}.home-card span{display:block;color:var(--muted);font-size:13px;line-height:1.45}.home-card.clickable{cursor:pointer}.home-card.clickable:hover{transform:translateY(-1px)}
@media(max-width:720px){.home-grid{grid-template-columns:1fr 1fr}.home-hero{padding:28px 20px}.home-hero h1{font-size:32px}}@media(max-width:480px){.home-grid{grid-template-columns:1fr}}

@media(max-width:720px){.mistake-summary{grid-template-columns:repeat(2,1fr)}}


.qt-practice-box{border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0;background:#fbfaf7}.qt-options{display:grid;gap:8px;margin-top:12px}.qt-option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;cursor:pointer}.qt-option.correct{background:#eef7ef;border-color:#4b7d55}.qt-option.wrong{background:#fff0f0;border-color:#a34c4c}.qt-feedback{margin-top:10px;min-height:20px;font-size:13px}.qt-selfcheck{display:grid;gap:8px;margin-top:10px}.qt-selfcheck label{font-size:13px}

.mock-audio{display:block;width:100%;margin:12px 0 16px !important}
.practice-q{margin-top:18px;padding-top:4px}
.practice-q > p{margin-bottom:12px}
.practice-q + .practice-q{border-top:1px solid var(--line);padding-top:18px}

/* Full-width primary navigation */
.maintabs{
  width:100vw;
  margin-left:calc(50% - 50vw);
  margin-right:calc(50% - 50vw);
  padding:0 40px 10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid var(--line);
}
@media(max-width:720px){.maintabs{padding-left:18px;padding-right:18px}}

</style>

}

}

}

<style id="vocab-viewport-fix">
/* Vocabulary Cards: keep the full study view compact enough for one viewport. */
.app-view.vocab .stage{min-height:260px;margin-bottom:10px;}
.app-view.vocab .card{width:min(76%,300px);}
.app-view.vocab .face{padding:18px 16px;}
.app-view.vocab .word{font-size:clamp(24px,5vw,32px);}
.app-view.vocab .ipa{margin-bottom:10px;}
.app-view.vocab .hint{margin-top:10px;}
.app-view.vocab .progress-row{margin-bottom:10px;}
.app-view.vocab .actions{gap:8px;}
.app-view.vocab .action-btn{padding:11px 8px;font-size:13px;}
.app-view.vocab .deck-controls{margin-top:8px;}
@media(max-width:720px){
  .app-view.vocab .stage{min-height:238px;}
  .app-view.vocab .card{width:min(72vw,270px);}
  .app-view.vocab .actions{gap:7px;}
  .app-view.vocab .action-btn{padding:10px 7px;font-size:12.5px;}
}
</style>


<style id="ui-spacing-fix">
/* Restore comfortable page gutters */
main, .main, .container, .content, .wrap, .app-shell {
  padding-left: 22px !important;
  padding-right: 22px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

/* Center top navigation across the available width */
.nav, .main-nav, .top-nav, nav {
  display:flex !important;

/* Lookup index so words that appear inside a definition/example can be made clickable */
/* Oxford 3000 Turkish meaning enrichment. The vocabulary itself is embedded locally;
   this optional dictionary fills missing Turkish meanings when the device is online. */
async function enrichOxfordMeanings(){
  const sources = [
    'https://gist.githubusercontent.com/enciyo/0cc13513b587999fe686ed22f46b4e1b/raw/oxford_3000_tr_en_type.json',
    'https://raw.githubusercontent.com/ciwga/Oxford3000_Vocab/main/oxford3000_vocabulary_with_collocations_and_definitions_datasets.csv'
  ];
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  try{
    const r = await fetch(sources[0], {cache:'force-cache'});
    if(r.ok){
      const data = await r.json();
      const map = new Map();
      data.forEach(x=>{ if(x && x.word && x.meaning) map.set(norm(x.word), x); });
      WORDS.forEach(w=>{
        if(!w.tr){
          const x=map.get(norm(w.word));
          if(x) w.tr=x.meaning;
        }
      });
    }
  }catch(e){}
  WORDS.forEach(w=>{ WORD_INDEX[w.word.toLowerCase()] = w; });
  if(typeof render==='function') render();
}
const WORD_INDEX = {};
WORDS.forEach(w => { WORD_INDEX[w.word.toLowerCase()] = w; });
enrichOxfordMeanings();

let revealedWords = new Set(); // words currently showing their Turkish meaning in the Word List view

function linkify(text, excludeWord){
  const exclude = excludeWord.toLowerCase();
  return text.replace(/[A-Za-z']+/g, (token) => {
    const key = token.toLowerCase();
    const entry = WORD_INDEX[key];
    if(key !== exclude && entry){
      const trAttr = entry.tr ? ` title="${entry.tr}"` : '';
      return `<span class="def-word" data-word="${key}"${trAttr}>${token}</span>`;
    }
    return token;
  });
}

function renderFamilyList(familyStr){
  if(!familyStr) return '';
  const items = familyStr.split(' | ').map(item=>{
    const idx = item.indexOf(':');
    if(idx === -1) return `<li>${item}</li>`;
    const label = item.slice(0, idx).trim();
    const def = item.slice(idx+1).trim();
    return `<li><b>${label}</b> — ${def}</li>`;
  }).join('');
  return `<div class="family-block"><div class="family-title">Word family</div><ul class="family-list">${items}</ul></div>`;
}

let speakingRecording = { recording:false, status:'Microphone ready. Record your answer and listen back.', url:'' };

async function startSpeakingRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    speakingRecording.status = 'Microphone recording is not supported by this browser.';
    render();
    return;
  }
  try{
    speakingStream = await navigator.mediaDevices.getUserMedia({audio:true});
    speakingChunks = [];
    speakingRecorder = new MediaRecorder(speakingStream);
    speakingRecorder.ondataavailable = e => { if(e.data && e.data.size) speakingChunks.push(e.data); };
    speakingRecorder.onstop = () => {
      const mime = speakingRecorder.mimeType || 'audio/webm';
      speakingAudioBlob = new Blob(speakingChunks,{type:mime});
      if(speakingAudioUrl) URL.revokeObjectURL(speakingAudioUrl);
      speakingAudioUrl = URL.createObjectURL(speakingAudioBlob);
      speakingRecording.recording = false;
      speakingRecording.url = speakingAudioUrl;
      speakingRecording.status = 'Recording complete. Play it back or save it.';
      if(speakingStream) speakingStream.getTracks().forEach(t=>t.stop());
      speakingStream = null;
      render();
    };
    speakingRecorder.start();
    speakingRecording.recording = true;
    speakingRecording.status = 'Recording… speak clearly into your microphone.';
    render();
  }catch(err){
    speakingRecording.recording = false;
    speakingRecording.status = 'Microphone access was denied or unavailable. Check Chrome site permissions and try again.';
    render();
  }
}

function stopSpeakingRecording(){
  if(speakingRecorder && speakingRecorder.state !== 'inactive') speakingRecorder.stop();
}

function playSpeakingRecording(){
  if(!speakingAudioUrl) return;
  const a = new Audio(speakingAudioUrl);
  a.play().catch(()=>{});
}

function downloadSpeakingRecording(){
  if(!speakingAudioBlob || !speakingAudioUrl) return;
  const a = document.createElement('a');
  a.href = speakingAudioUrl;
  a.download = `ote-speaking-part-${speakingTestMode}-${speakingPartIndex+1}.webm`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}


function openSpeakingDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB not supported')); return; }
    const req=indexedDB.open(SPEAKING_DB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(SPEAKING_DB_STORE)) db.createObjectStore(SPEAKING_DB_STORE,{keyPath:'id'}); };
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function loadSpeakingHistory(){
  try{ const db=await openSpeakingDB(); const rows=await new Promise((res,rej)=>{const tx=db.transaction(SPEAKING_DB_STORE,'readonly');const r=tx.objectStore(SPEAKING_DB_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}); speakingHistory=rows.sort((a,b)=>b.time-a.time); speakingHistoryReady=true; render(); }
  catch(e){ speakingHistoryReady=true; speakingHistory=[]; render(); }
}

function speak(word, lang, rate){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = lang || accent;
  u.rate = rate || 0.9;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang===u.lang) || voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice = v;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

    box.innerHTML = `<p class="placeholder-note">Couldn't reach the AI checker right now (${err.message}). This feature depends on the environment you're viewing this file in being able to reach the API — if you're opening the file outside the Claude app (e.g. your own server or a plain browser), this call may not be authorized.</p>`;
  }
}

function renderEssayFeedback(fb){
  const box = document.getElementById('essayFeedback');
  if(!box) return;
  box.innerHTML = `
    <div class="card-block" style="background:var(--paper-2);">

    </div>
  `;

function toggleReveal(word){
  if(revealedWords.has(word)) revealedWords.delete(word); else revealedWords.add(word);
  render();
}
function toggleUnknown(word){
  const entry = WORD_INDEX[word];
  if(!entry) return;
  const already = reviewList.some(w=>w.word===entry.word);
  if(already){ reviewList = reviewList.filter(w=>w.word!==entry.word); }
  else { reviewList.push(entry); }
  render();
}
function next(result){
  const card = deck[index];
  if(result==='know'){ known++; addToList(learnedList, card); }
  if(result==='review'){ review++; addToList(reviewList, card); }
  flipped = false;
  if(index+1 >= deck.length) finished = true; else index++;
  render();
}
function prev(){
  if(index > 0){
    index--;
    flipped = false;
    finished = false;
    render();
  }
}
function restart(shuffleAgain){
  deck = shuffleAgain ? shuffle(WORDS.filter(w=>w.level===currentLevel)) : WORDS.filter(w=>w.level===currentLevel);
  index=0; flipped=false; known=0; review=0; finished=false;
  render();
}

    mainidea:{q:'What is the main point of the text?', passage:'Many companies have introduced hybrid working. Although employees often value the flexibility, managers have had to rethink how teamwork, communication and performance are monitored. The change has therefore affected both workers and the systems used to manage them.', options:['A. Hybrid working benefits employees but creates no problems for managers.','B. Hybrid working requires changes in how organisations operate and manage staff.','C. Most companies are planning to return to full-time office work.'], correct:1, a:'Choose the option broad enough to cover the whole paragraph. Do not select a detail.', tag:'Main idea'},
    inference:{q:'What does the writer imply about the proposal?', passage:'The council described the new cycle lanes as a temporary measure. Nevertheless, funding has already been allocated for maintenance over the next five years.', options:['A. The cycle lanes are unlikely to remain in use.','B. The council may expect the cycle lanes to become permanent.','C. The council has not decided whether the cycle lanes are useful.'], correct:1, a:'The text never says they will become permanent, but the long-term funding suggests that possibility.', tag:'Inference'},
    purpose:{q:'Why does the writer mention the earlier study?', passage:'The first study reported a small improvement in memory after exercise. A later investigation, using a larger sample, produced a similar result. The second study is important because it strengthens confidence in the original finding.', options:['A. To show that the later study contradicted the first one.','B. To explain why the original finding is now more credible.','C. To demonstrate that the original study used a larger sample.'], correct:1, a:'Ask what function the reference serves in the argument. Here it supports the credibility of the earlier finding.', tag:"Writer's purpose"},
    attitude:{q:'How does the writer feel about the development?', passage:'The new public transport scheme is certainly ambitious, and the reduction in traffic is welcome. Yet without better connections to outer districts, its benefits are likely to remain unevenly distributed.', options:['A. Completely enthusiastic','B. Cautiously positive','C. Strongly opposed'], correct:1, a:'Look at both positive and qualifying language: the writer welcomes the idea but expresses a reservation.', tag:'Attitude / viewpoint'},
    meaning:{q:'What does “considerable” mean in this context?', passage:'The renovation required a considerable amount of funding, far more than the organisers had originally expected.', options:['A. Small','B. Uncertain','C. Large'], correct:2, a:'Replace the word in context: “a large amount of funding” fits naturally.', tag:'Meaning in context'},
    reference:{q:'What does “this” refer to in the second sentence?', passage:'The researchers repeated the experiment with a larger group of participants. This allowed them to compare the results more reliably.', options:['A. Repeating the experiment with a larger group','B. The original experiment','C. The participants themselves'], correct:0, a:'Follow the logic: “This” refers to the immediately preceding action, not simply the nearest noun.', tag:'Reference'},
    paraphrase:{q:'Which option best expresses the writer’s idea?', passage:'The policy is unlikely to solve the problem on its own, although it may contribute to a longer-term improvement.', options:['A. The policy will completely resolve the problem.','B. The policy may help, but it is not a sufficient solution by itself.','C. The policy is expected to make the problem worse.'], correct:1, a:'Match meaning, not vocabulary. The correct option preserves both the limitation and the possible benefit.', tag:'Paraphrase'}
  },
  listening: {
    'mc-detail':{q:'Why was the meeting moved?', script:'We had originally planned to meet on Tuesday, but the laboratory will be unavailable that day, so we have moved the meeting to Thursday morning.', options:['A. The speaker is travelling on Tuesday.','B. The laboratory cannot be used on Tuesday.','C. The meeting room is needed on Thursday.'], correct:1, a:'Listen for the concrete reason given in the recording.', tag:'Multiple choice · detail'},
    'mc-attitude':{q:'How does the speaker feel about the decision?', script:'At first I thought the change would cause problems, but I have to admit it has made the process much more efficient than before.', options:['A. Reluctantly positive','B. Completely opposed','C. Indifferent'], correct:0, a:'The speaker changes from concern to a positive evaluation, so the attitude is cautiously/reluctantly positive.', tag:'Multiple choice · attitude'},
    'mc-purpose':{q:'Why does the speaker mention the earlier example?', script:'The first project failed because the team did not consult local residents. I mention it because the same mistake could easily be repeated in the new proposal.', options:['A. To provide a successful model','B. To explain the importance of avoiding a previous mistake','C. To show that the new proposal is identical'], correct:1, a:'Identify the function of the example: it illustrates a warning that is relevant to the new proposal.', tag:'Multiple choice · purpose'},
    'mc-inference':{q:'What does the speaker imply about the situation?', script:'Nobody has officially announced the closure, but staff have already been asked to clear their desks and return their access cards.', options:['A. A closure is probably imminent.','B. The staff have been promoted.','C. The office has moved to a new building.'], correct:0, a:'Combine the clues. The speaker never explicitly says “the office will close”, but the actions strongly suggest it.', tag:'Multiple choice · inference'},
    notes:{q:'Complete the note.', script:'The research project was delayed because the main equipment arrived three weeks later than expected.', gap:'equipment arrived ______ than expected', answer:'three weeks later', a:'Predict what kind of phrase fits the blank, then listen for the exact wording.', tag:'Note completion'},
    opinion:{q:'Who thinks the policy needs to change?', script:'Woman: I think the policy is too restrictive. Man: I can see why people say that, but I think the current rules are reasonable.', options:['A. The woman','B. The man','C. Both'], correct:0, a:'Track each speaker separately. Do not assume agreement just because they discuss the same topic.', tag:'Identifying opinions'}

  speaking: {

    summary:{q:'Combine the main ideas from a textbook extract and a lecture in one paragraph.', practice:'Write 80–100 words. Include the important information from both sources without adding your opinion.', a:'Select main information, paraphrase accurately and synthesise the two sources.', tag:'Advanced · Summary'}

function renderQuestionTypeTrainer(){
  const data=QUESTION_TRAINER[questionTrainerModule];
  const selected=data.types.find(x=>x[0]===questionTrainerType) || data.types[0];
  const typeKey=selected[0];
  const ex=QT_EXAMPLES[questionTrainerModule][typeKey];
  const options=data.types.map(x=>`<div class="qt-chip ${questionTrainerType===x[0]?'active':''}" onclick="setQuestionTrainerType('${x[0]}')">${x[1]}</div>`).join('');
  const hasOptions=Array.isArray(ex.options);
  let practiceHTML='';
  if(hasOptions){
    practiceHTML=`<div class="qt-practice-box"><div class="family-title">Try it yourself</div><p>${ex.passage||ex.script||''}</p><h4>${ex.q}</h4><div class="qt-options">${ex.options.map((o,i)=>`<button class="qt-option" onclick="checkQTAnswer(this,${i===ex.correct})">${o}</button>`).join('')}</div><div id="qt-feedback" class="qt-feedback"></div></div>`;
  } else if(questionTrainerModule==='listening' && ex.gap){
    practiceHTML=`<div class="qt-practice-box"><div class="family-title">Try it yourself</div><p>${ex.script}</p><p><b>${ex.gap.replace('______','_____')}</b></p><input id="qt-text-answer" placeholder="Type what you hear" style="max-width:420px"><button class="speak-btn" style="margin-top:9px" onclick="checkQTText('${ex.answer.replace(/'/g,"\\'")}')">Check answer</button><div id="qt-feedback" class="qt-feedback"></div></div>`;
  } else {
    practiceHTML=`<div class="qt-practice-box"><div class="family-title">Try it yourself</div><p>${ex.practice||ex.q}</p><div class="qt-selfcheck"><label><input type="checkbox"> I completed the task under time.</label><label><input type="checkbox"> I developed my answer.</label><label><input type="checkbox"> I checked my response.</label></div></div>`;
  }
  return `
    <div class="section-title">Question Type Trainer</div>
    <div class="listaccess-row">
      <div class="listaccess-chip ${questionTrainerModule==='reading'?'active':''}" onclick="setQuestionTrainerModule('reading')">Reading</div>
      <div class="listaccess-chip ${questionTrainerModule==='listening'?'active':''}" onclick="setQuestionTrainerModule('listening')">Listening</div>
      <div class="listaccess-chip ${questionTrainerModule==='speaking'?'active':''}" onclick="setQuestionTrainerModule('speaking')">Speaking</div>
      <div class="listaccess-chip ${questionTrainerModule==='writing'?'active':''}" onclick="setQuestionTrainerModule('writing')">Writing</div>
    </div>
    <div class="qt-summary"><b>${data.title}</b><p style="margin:5px 0 0;font-size:12.5px;opacity:.65;">Choose one skill and practise the exact task type rather than mixing question types.</p></div>
    <div class="qt-chiprow">${options}</div>
    <div class="qt-grid">${data.types.map(x=>`<div class="qt-card ${x[0]===typeKey?'active':''}" onclick="setQuestionTrainerType('${x[0]}')"><div class="qt-type">${questionTrainerModule}</div><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>
    <div class="card-block"><span class="tag">${ex.tag}</span><h4>Example practice</h4>${practiceHTML}<div class="family-block"><div class="family-title">How to approach it</div><p style="margin:6px 0 0;">${ex.a}</p></div></div>`;
}
function checkQTAnswer(btn,correct){btn.parentElement.querySelectorAll('.qt-option').forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');const f=document.getElementById('qt-feedback');if(f)f.innerHTML=correct?'<b>Correct.</b> Good choice — now read the explanation below.':'<b>Not quite.</b> Review the approach below and try the question again after switching type.';}
function checkQTText(ans){const v=(document.getElementById('qt-text-answer')?.value||'').trim().toLowerCase();const f=document.getElementById('qt-feedback');if(f)f.innerHTML=v===ans.toLowerCase()?'<b>Correct.</b>':'<b>Not quite.</b> Expected: '+ans;}


function renderVocab(){
  let out = `
    <div class="levelrow">
      <div class="levelpill ${currentLevel==='A2'?'active':''}" onclick="loadDeck('A2');render();">A2</div>
      <div class="levelpill ${currentLevel==='B1'?'active':''}" onclick="loadDeck('B1');render();">B1</div>
      <div class="levelpill ${currentLevel==='B2'?'active':''}" onclick="loadDeck('B2');render();">B2</div>
      <div class="levelpill ${currentLevel==='C1'?'active':''}" onclick="loadDeck('C1');render();">C1</div>
    </div>
    <div class="listaccess-row">
      <div class="listaccess-chip ${vocabView==='list'?'active':''}" onclick="setVocabView('list')">📃 Word List</div>
      <div class="listaccess-chip ${vocabView==='review'?'active':''}" onclick="setVocabView('review')">↻ Review List (${reviewList.length})</div>
      <div class="listaccess-chip ${vocabView==='learned'?'active':''}" onclick="setVocabView('learned')">✓ Learned Words (${learnedList.length})</div>
      ${vocabView!=='study' ? `<div class="listaccess-chip back" onclick="setVocabView('study')">← Back to cards</div>` : ``}
    </div>
  `;

  if(vocabView==='list'){
    const items = WORDS.filter(w=>w.level===currentLevel).sort((a,b)=>a.word.localeCompare(b.word));
    out += `<div class="section-title">Word List — ${currentLevel}</div>`;
    out += `<p class="placeholder-note" style="margin-bottom:10px;">Tap a word to reveal its Turkish meaning (or just hover on desktop). Underlined words inside a definition also show their Turkish translation on hover. Check the box next to any word you don't know — it's added straight to your Review List.</p>`;
    out += `<div class="wordlist">`;
    out += items.map(w=>{
      const revealed = revealedWords.has(w.word);
      return `
        <div class="wl-row">
          <div class="wl-item">
            <div class="wl-word-wrap" data-word="${w.word}" title="${w.tr || ''}">
              <span class="wl-word">${w.word}</span>
              <span class="wl-ipa">${w.ipa}</span>
              ${revealed ? `<span class="wl-tr">${w.tr}</span>` : ``}
            </div>
            <div class="wl-meaning">${w.pos ? `<span class="pos-tag">${w.pos}</span> ` : ``}${w.meaning}</div>
            ${(w.syn || w.opp) ? `<div class="synopp-row">${w.syn ? `<span class="syn-tag">≈ ${w.syn}</span>` : ``}${w.opp ? `<span class="opp-tag">↔ ${w.opp}</span>` : ``}</div>` : ``}
            ${renderFamilyList(w.family)}
          </div>
        </div>`;
    }).join('');
    out += `</div>`;
    return out;
  }

  if(vocabView==='review' || vocabView==='learned'){
    const list = vocabView==='review' ? reviewList : learnedList;
    const title = vocabView==='review' ? 'Review List' : 'Learned Words';
    const emptyMsg = vocabView==='review'
      ? "No words marked for review yet. Tap ↻ Review on a card to add one here."
      : "No learned words yet. Tap ✓ Know it on a card to add one here.";
    out += `<div class="section-title">${title}</div>`;
    if(list.length===0){
      out += `<p class="placeholder-note">${emptyMsg}</p>`;
    } else {
      out += list.map(w=>`
        <div class="card-block">
          <div class="booklink">
            <div>
              <h4 style="margin-bottom:2px;">${w.word} <span style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.5;font-weight:400;">${w.ipa}</span></h4>
              <p style="margin-bottom:0;">${w.meaning}</p>
              ${w.tr ? `<p style="margin-bottom:0;opacity:.55;font-size:12.5px;">${w.tr}</p>` : ``}
            </div>
            <button class="link-btn" onclick="removeFromList('${vocabView}','${w.word}')">Remove ✕</button>
          </div>
          <p style="margin-top:6px;font-style:italic;opacity:.65;">"${w.example}"</p>
        </div>
      `).join('');
    }
    return out;
  }

  const total = deck.length;
  if(finished){
    out += `
      <div class="end-screen">
        <div class="end-title">Deck complete</div>
        <div class="end-stats">
          <div class="stat"><div class="stat-num green">${known}</div><div class="stat-label">Know it</div></div>
          <div class="stat"><div class="stat-num red">${review}</div><div class="stat-label">Review</div></div>
        </div>
        <button class="restart-btn" onclick="restart(true)">Shuffle and restart</button>
        <div style="margin-top:12px;"><button class="link-btn" onclick="restart(false)">Play again in order</button></div>
      </div>`;
    return out;
  }
  const card = deck[index];
  const pct = Math.round((index/total)*100);
  out += `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-count">${index+1} / ${total}</div>
    </div>
    <div class="stage">
      <div class="stack-deco d1"></div><div class="stack-deco d2"></div>
      <div class="card ${flipped?'flipped':''}" id="cardEl">
        <div class="card-inner">
          <div class="face front">
            <div class="face-eyebrow">${card.level} · Word</div>
            <div class="word">${card.word}</div>
            <div class="ipa">${card.ipa}</div>
            <button class="speak-btn" id="speakBtn">🔊 Pronounce</button>
            <div class="accent-row">
              ${ACCENTS.map(a=>`<div class="accent-chip ${accent===a.id?'active':''}" data-accent="${a.id}">${a.label}</div>`).join('')}
            </div>
            <div class="hint">Tap the card to see the meaning</div>
          </div>
          <div class="face back">
            <div class="face-eyebrow">Meaning</div>
            <div class="meaning">${card.pos ? `<span class="pos-tag">${card.pos}</span> ` : ``}${card.meaning}</div>
            ${(card.syn || card.opp) ? `<div class="synopp-row">${card.syn ? `<span class="syn-tag">≈ ${card.syn}</span>` : ``}${card.opp ? `<span class="opp-tag">↔ ${card.opp}</span>` : ``}</div>` : ``}
            ${card.tr ? `<div class="tr-meaning">${card.tr}</div>` : ``}
            <div class="example">"${card.example}"</div>
            ${renderFamilyList(card.family)}
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="action-btn prev" onclick="prev()" ${index===0 ? 'disabled' : ''}>← Previous</button>
      <button class="action-btn review" onclick="next('review')">↻ Review</button>
      <button class="action-btn know" onclick="next('know')">✓ Know it</button>
    </div>
    <div class="deck-controls"><button class="link-btn" onclick="restart(true)">Reshuffle the deck</button></div>
  `;
  return out;
}

    <div class="card-block">
      <span class="tag">PRACTICE</span>

}

function renderWriting(){
  const connectorsCard = `
    <div class="card-block">
      <span class="tag">USEFUL LINKING PHRASES · BY FUNCTION</span>
      <h4>Addition</h4>
      <p>Moreover / Furthermore / In addition / What is more / Besides</p>

      <p>However / Nevertheless / On the other hand / In contrast / Whereas / Although / Despite this</p>

      <h4>Write a draft and get AI feedback</h4>

      </div>
      <button class="restart-btn" id="checkEssayBtn" style="margin-top:10px;">Check with AI</button>

    <div class="section-title">Writing</div>

      <div class="listaccess-chip ${writingPart==='part2'?'active':''}" onclick="setWritingPart('part2')">Part 2</div>

  if(writingType==='ote' && writingPart==='part1'){
    out += `
      <div class="card-block">
        <span class="tag">PART 1 · EMAIL RESPONSE</span>
        <h4>Structure and timing</h4>
        <p>You reply to an input email that includes three points to cover — make sure you address every one of them. Tone can be informal or neutral depending on who you're writing to. Target: 80-130 words, 20 minutes.</p>
        <ul class="phrase-list">
          <li>Thanks for your email / Thank you for getting in touch about ...</li>
          <li>To answer your question, ...</li>
          <li>I'd suggest ... / Why don't you ...?</li>
          <li>Let me know if you need anything else. / Speak soon!</li>
        </ul>
        <p>Treat the three prompts as more than a checklist — each one is a chance to show off a different function: explaining a reason, making a suggestion, apologizing, giving an opinion. Varying your language across the three responses (rather than repeating the same structure three times) is what actually raises your Lexis and Grammar scores, on top of the Task Fulfilment marks you get just for covering them.</p>
        <p>Watch out for prompts that secretly ask for more than one thing — a plural like "suggest some ideas" needs at least two suggestions, not one, and a prompt like "say which and why" needs both a choice and a reason. Answering only half of a compound prompt still costs you marks, even though you technically responded to it.</p>
        <p>Use your own words. It's tempting to lift a phrase straight out of the input email when you reply to a prompt, but this doesn't show the examiner your own range of vocabulary and grammar — try rephrasing the idea instead of copying it word for word.</p>
        <p>Match your formality to the relationship. The input email might be from a close friend, an acquaintance, or someone you don't know at all — check the sign-off and tone of the email itself for a clue. Write informally to a friend, and use neutral or more formal language for someone you don't know well.</p>
        <p class="placeholder-note">On the real test screen: a countdown clock and a live word counter are always visible, and the "To" and "Subject" fields are already filled in for you — you only need to type the message body.</p>
      </div>
      <div class="card-block">
        <span class="tag">FUNCTIONS &amp; USEFUL PHRASES</span>
        <h4>Match the right phrase to the right function</h4>
        <p>Each prompt in the email usually asks you to do something specific — not just "answer" it, but perform a function like suggesting, apologizing, or thanking. Recognizing which function a prompt needs helps you pick the right phrase.</p>
        <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;">

      <p><b>Before you read:</b> identify whether the question tests detail, inference, attitude, purpose, implication or the relationship between ideas. At C1, the correct answer is often a paraphrase rather than a repeated phrase.</p>
      <p><b>Part 1 — Short Texts:</b> read the question first, then locate the relevant sentence. Check whether the option is fully supported; an answer can sound reasonable but still be too broad or introduce information not stated.</p>
      <p><b>Part 2 — Multiple Matching:</b> mark the distinctive claim in each question and search for its paraphrase in each text. Track changes in stance such as <i>however</i>, <i>although</i>, <i>admittedly</i>, and <i>nevertheless</i>.</p>
      <p><b>Part 3 — Gapped Text:</b> use both grammatical and discourse clues. Pronouns, articles, connectors, repeated terminology, chronology and cause-and-effect links should make the sentence fit naturally on both sides of the gap.</p>
      <p><b>Part 4 — Longer Text:</b> map the writer's argument: claim → evidence → qualification → conclusion. For “Why does the writer mention...?” questions, ask what role the example plays in the argument, not simply what it says.</p>
      <p><b>C1 reading habit:</b> separate <i>what the text says</i> from <i>what the writer implies</i>. Pay attention to hedging such as <i>may</i>, <i>tends to</i>, <i>arguably</i>, and <i>to some extent</i>.</p>
      <p><b>Common question types:</b> main idea, writer's purpose, inference, attitude, reference, meaning in context, specific detail, implication, and paraphrase.</p>
      </div>`;
  } else {
    out += `<div class="card-block"><span class="tag">OTE</span><h4>Reading Tips</h4>
      <p><b>Before you read:</b> read the question first when possible. Identify what the task is asking for — detail, main idea, inference, purpose, attitude, or reference.</p>
      <p><b>Part 1 — Short Texts:</b> scan for the exact information requested. Do not spend too long reading a short text word by word.</p>
      <p><b>Part 2 — Multiple Matching:</b> underline distinctive ideas in the questions and look for paraphrases, not identical words. Use elimination when a profile or text has already been matched.</p>
      <p><b>Part 3 — Gapped Text:</b> read both sides of each gap. Check pronouns, linking expressions, repeated concepts, time sequence, contrast, cause and effect, and paragraph flow.</p>
      <p><b>Part 4 — Longer Text:</b> skim first for the overall argument, then return to the relevant paragraph for each question. For “Why does the writer mention...?” questions, identify the function of the example rather than just locating it.</p>
      <p><b>Vocabulary:</b> when a word is unfamiliar, use the surrounding sentence and paragraph to infer meaning. Look for contrast markers such as <i>however</i>, <i>although</i>, <i>while</i>, and examples introduced by <i>for instance</i>.</p>
      <p><b>Common question types:</b> main idea, writer's purpose, inference, attitude, reference, meaning in context, specific detail, implication, and paraphrase.</p>
      </div>`;
  }
  return out;
}

  test.parts.forEach((part,pi)=>{
    out+=`<div class="card-block"><span class="tag">${part.title}</span><h4>${part.title}</h4><p>${part.desc}</p>`;
    if(part.audio) out+=`<audio class="mock-audio" controls preload="metadata"><source src="./${part.audio.replace(/^\.\//,'')}" type="audio/mpeg"></audio>`;

    if(part.gaps){out+=`<div class="notes-box" style="background:var(--paper-2);padding:14px;border-radius:12px"><ol>${part.gaps.map((g,gi)=>`<li style="margin:8px 0"><input id="gap_${listeningTestType}_${pi}_${gi}" placeholder="Enter the missing word(s)"></li>`).join('')}</ol><button class="primary-btn" onclick="checkMockGaps(${pi})">Check answers</button><div id="gapres_${listeningTestType}_${pi}" style="margin-top:10px"></div></div>`}

function setListeningTestType(v){listeningTestType=v;render()}
function markMock(id,choice,correct,el){
  const box=document.getElementById('ans_'+id);if(!box)return;
  const parent=el.parentElement;parent.querySelectorAll('.quiz-option').forEach(x=>x.classList.remove('correct','incorrect'));
  if(choice===correct){el.classList.add('correct');box.style.display='block';box.textContent='✓ Correct';mockAnswers[id]=true}else{el.classList.add('incorrect');box.style.display='block';box.textContent='✗ Not quite. Try again.';mockAnswers[id]=false;}
  updateMockScore();
}
function checkMockGaps(pi){const part=LISTENING_MOCK[listeningTestType].parts[pi];let score=0;part.answers.forEach((a,i)=>{const v=(document.getElementById(`gap_${listeningTestType}_${pi}_${i}`)?.value||'').trim().toLowerCase();if(v===a.toLowerCase()){score++;}});const r=document.getElementById(`gapres_${listeningTestType}_${pi}`);r.textContent=`Score: ${score}/${part.answers.length}`;updateMockScore();}
function updateMockScore(){const vals=Object.values(mockAnswers);const done=vals.filter(v=>v).length;const total=LISTENING_MOCK[listeningTestType].parts.filter(p=>p.items).reduce((n,p)=>n+p.items.length,0);const el=document.getElementById('mockScore');if(el)el.textContent=`Multiple-choice items answered: ${vals.length}. Correct: ${done}/${total}.`}
function resetMockTest(){mockAnswers={};render()}

function highlightAffix(base, derived, text){
  const b = base.toLowerCase(), d = derived.toLowerCase();
  let start;
  if(d.endsWith(b) && d.length > b.length){
    // prefix pattern: un+happy -> highlight the leading part
    start = d.length - b.length;
    // but for prefix pattern we color [0,start), not [start,end) — handle separately
    const lead = derived.slice(0, start);
    const rest = derived.slice(start);
    var highlighted = `<span style="color:var(--red);font-weight:600;">${lead}</span>${rest}`;
    var colorFn = (match) => {
      const leadC = match.slice(0, start);
      const restC = match.slice(start);
      return `<span style="color:var(--red);font-weight:600;">${leadC}</span>${restC}`;
    };
  } else {
    // suffix pattern: find longest common prefix, then color the remainder
    let i = 0;
    while(i < b.length && i < d.length && b[i] === d[i]) i++;
    start = i;
    const lead = derived.slice(0, start);
    const rest = derived.slice(start);
    highlighted = lead + `<span style="color:var(--red);font-weight:600;">${rest}</span>`;
    colorFn = (match) => {
      const leadC = match.slice(0, start);
      const restC = match.slice(start);
      return leadC + `<span style="color:var(--red);font-weight:600;">${restC}</span>`;
    };
  }
  if(text === undefined) return highlighted;
  const re = new RegExp(derived.charAt(0).toUpperCase()+derived.slice(1) + '|' + derived, 'g');
  return text.replace(re, (match) => {
    if(match.toLowerCase() !== d) return match;
    return colorFn(match);
  });
}

      <p>${q.sentence}</p>

        else if(isWrongTried) cls += ' incorrect';

function selectOteAnswer(qId, optIndex, correctIndex){
  if(oteQuizAnswers[qId] !== undefined) return;
  if(optIndex === correctIndex){
    oteQuizAnswers[qId] = optIndex;
  } else {
    if(!oteQuizWrong[qId]) oteQuizWrong[qId] = [];
    if(!oteQuizWrong[qId].includes(optIndex)) oteQuizWrong[qId].push(optIndex);
    const all = [...Object.values(READING_OTE), ...Object.values(LISTENING_OTE)];
    let found = null;
    for(const part of all){ if(part && Array.isArray(part.items)){ const hit = part.items.find(x=>x.id===qId); if(hit){ found = hit; break; } } }
    if(found){ logMistakeFromQuestion({source: mainTab==='readingt'?'Reading':'Listening', level: found.level || (mainTab==='readingt'?'OTE':'OTE'), type: found.type || (mainTab==='readingt'? 'OTE Format':'Multiple Choice'), question: found.question || found.note || qId, yourAnswer: found.options?.[optIndex] || 'Wrong answer', correctAnswer: found.options?.[correctIndex] || 'Correct answer', id:qId}); }
  }
  render();
}

function renderOteOptions(item){
  const solved = oteQuizAnswers[item.id] !== undefined;
  const wrongList = oteQuizWrong[item.id] || [];
  return item.options.map((opt, oi) => {
    let cls = 'quiz-option';
    const isWrongTried = wrongList.includes(oi);
    if(solved && oi === item.correct) cls += ' correct';
    else if(isWrongTried) cls += ' incorrect';
    const clickable = !solved && !isWrongTried;
    return `<div class="${cls}" onclick="${clickable ? `selectOteAnswer('${item.id}',${oi},${item.correct})` : ''}">${opt}</div>`;
  }).join('');
}

function playOteAudio(playId, script, accent){
  if(!('speechSynthesis' in window)) return;
  if(playingAudioId === playId){
    window.speechSynthesis.cancel();
    playingAudioId = null;
    render();
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(script);
  u.lang = accent;
  u.rate = 0.95;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(vv => vv.lang === u.lang) || voices.find(vv => vv.lang.startsWith('en'));
  if(v) u.voice = v;
  u.onend = () => { playingAudioId = null; render(); };
  u.onerror = () => { playingAudioId = null; render(); };
  playingAudioId = playId;
  window.speechSynthesis.speak(u);
  render();
}

      <input type="text" id="dictSearchInput" class="write-area" style="min-height:auto;padding:12px;" placeholder="Type a word, e.g. ambiguous" value="${dictQuery ? dictQuery.replace(/"/g,'&quot;') : ''}" />
      <button class="restart-btn" style="margin-top:10px;" onclick="searchDictionary()">Look up</button>
    </div>
  `;

  if(dictResult === 'loading'){
    out += `<div class="card-block"><p class="placeholder-note">Looking up "${dictQuery}"…</p></div>`;
  } else if(dictResult === 'error'){
    out += `<div class="card-block"><p class="placeholder-note">Couldn't reach the AI lookup right now. This depends on the environment you're viewing this file in being able to reach the API — if you're opening it outside the Claude app, this call may not be authorized.</p></div>`;
  } else if(dictResult && typeof dictResult === 'object'){
    const w = dictResult;
    const inList = reviewList.some(x => x.word === w.word);
    out += `
      <div class="card-block">
        <span class="tag">${w.level || '?'} · AI lookup</span>
        <div class="word" style="font-size:26px;">${w.word}</div>
        <div class="ipa">${w.ipa || ''}</div>
        <div class="meaning">${w.pos ? `<span class="pos-tag">${w.pos}</span> ` : ``}${w.meaning}</div>
        ${(w.syn || w.opp) ? `<div class="synopp-row">${w.syn ? `<span class="syn-tag">≈ ${w.syn}</span>` : ``}${w.opp ? `<span class="opp-tag">↔ ${w.opp}</span>` : ``}</div>` : ``}
        ${w.tr ? `<div class="tr-meaning">${w.tr}</div>` : ``}
        <div class="example">"${w.example}"</div>
        <button class="restart-btn" style="margin-top:12px;" onclick="addDictResultToList()">${inList ? '✓ Already in Word List' : '+ Add to Word List'}</button>
      </div>
    `;
  }

  out += `
    <div class="card-block">
      <p style="margin-bottom:8px;">Prefer a real dictionary?</p>
      <div class="dict-links">
        <button class="restart-btn" onclick="lookupWord('oxford')" style="margin:4px 6px 4px 0;">Oxford Learner's</button>
        <button class="restart-btn" onclick="lookupWord('cambridge')" style="margin:4px 6px 4px 0;">Cambridge</button>
        <button class="restart-btn" onclick="lookupWord('merriam')" style="margin:4px 6px 4px 0;">Merriam-Webster</button>
        <button class="restart-btn" onclick="lookupWord('collins')" style="margin:4px 6px 4px 0;">Collins</button>
        <button class="restart-btn" onclick="lookupWord('tureng')" style="margin:4px 6px 4px 0;">Tureng</button>
      </div>
    </div>
  `;
  out += `<p class="placeholder-note">The AI lookup gives an estimate, not an authoritative definition. External dictionary buttons open that site's own page in a new tab.</p>`;
  return out;
}

async function searchDictionary(){
  const input = document.getElementById('dictSearchInput');
  const val = (input ? input.value : '').trim();
  if(!val){ showToast("Type a word first!"); return; }
  dictQuery = val;
  dictResult = 'loading';
  render();
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 500,
        messages: [{
          role: "user",
          content: `You are a concise English dictionary for a Turkish-speaking learner preparing for the Oxford Test of English. Explain the English word or phrase: "${val}".

Respond with ONLY valid JSON, no markdown code fences, no extra text, in exactly this shape:
{"word":"${val}","ipa":"IPA transcription","pos":"e.g. n./v./adj./adv.","meaning":"a concise English definition","tr":"a concise Turkish translation","example":"one natural example sentence using the word","syn":"one close synonym, or empty string if none fits","opp":"one opposite, or empty string if none fits","level":"your best estimate of its CEFR level: A2, B1, B2, or C1"}

If "${val}" is not a recognizable English word, still return valid JSON with your best guess and set "meaning" to "This doesn't look like a recognized English word — check the spelling."`
        }]
      })
    });
    const data = await response.json();
    const raw = (data.content || []).map(c => c.text || '').join('').trim();
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    dictResult = parsed;
  } catch(err){
    dictResult = 'error';
  }
  render();
}

function addDictResultToList(){
  if(!dictResult || typeof dictResult !== 'object') return;
  const already = reviewList.some(w => w.word === dictResult.word);
  addToList(reviewList, dictResult);
  showToast(already ? `"${dictResult.word}" is already in your Word List` : `"${dictResult.word}" added to your Word List`);
  render();
}

function lookupWord(source){
  const word = dictQuery || (document.getElementById('dictSearchInput') || {}).value || '';
  if(!word.trim()){ showToast("Type a word first!"); return; }
  const w = encodeURIComponent(word.trim().toLowerCase());
  const urls = {
    oxford: `https://www.oxfordlearnersdictionaries.com/definition/english/${w}`,
    cambridge: `https://dictionary.cambridge.org/dictionary/english/${w}`,
    merriam: `https://www.merriam-webster.com/dictionary/${w}`,
    collins: `https://www.collinsdictionary.com/dictionary/english/${w}`,
    tureng: `https://tureng.com/en/turkish-english/${w}`,
  };
  window.open(urls[source], '_blank', 'noopener');
}

function showToast(msg){
  let toast = document.getElementById('appToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'appToast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
}
